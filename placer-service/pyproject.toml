[project]
name = "fly-placer"
version = "0.1.0"
description = "Traffic-driven placement for SQLite reader fleets on Fly.io."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.14,<1",
    "uvicorn>=0.30,<1",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "python-dateutil>=2.9,<3",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Refresh the committed installation files with uv 0.9.26:
# uv pip compile pyproject.toml --python-version 3.11 --universal --generate-hashes -o requirements.txt
# uv pip compile pyproject.toml --extra test --python-version 3.11 --universal --generate-hashes -o requirements-dev.txt
