# Start with synthetic traffic and simulated placement. No Fly token is needed.
dry_run: true

# Last attempted action per region, including removals and uncertain timeouts.
cooldown_period: 300
command_timeout: 120
process_group: app
data_dir: data

# Samples are collected per trigger. Run one trigger per minute for 5/20-minute windows.
short_term_window: 5
long_term_window: 20
alpha_short: 0.3
alpha_long: 0.1

# Counts are requests observed over the latest five minutes.
# Add when short average >= traffic_threshold.
# Remove only when BOTH short and long averages <= deployment_threshold.
traffic_threshold: 50
deployment_threshold: 10

# Hard cap on regions; never remove below the minimum.
min_regions: 1
max_regions: 5
allowed_regions: [iad, cdg, lhr, fra, sea]
excluded_regions: []

# Required placements: create if missing and never remove.
# Set this to your target application's required region(s) before live use.
always_running_regions: [fra]
