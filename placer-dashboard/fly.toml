app = "placer-dashboard"
primary_region = "sea"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
  PLACER_SERVICE_URL = "http://placer-service.internal:8000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
