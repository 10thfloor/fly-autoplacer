app = "fly-auto-placer"
primary_region = "sea"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PLACER_SERVICE_URL = "http://placer.process.fly-auto-placer.internal:8000"

[processes]
  dashboard = "dashboard"
  placer = "placer"

[http_service]
  processes = ["dashboard"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[checks.placer]
  processes = ["placer"]
  type = "http"
  port = 8000
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  processes = ["dashboard"]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[vm]]
  processes = ["placer"]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[mounts]]
  source = "placer_service_data"
  destination = "/app/placer-service/data"
  processes = ["placer"]
